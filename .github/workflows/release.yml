name: Build plugin release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify PHP and regression tests
        run: |
          find . -name '*.php' -not -path './.git/*' -exec php -l {} \;
          php tests/filter.php
          php tests/divi-key.php
          php tests/divi-map.php
          php tests/updater.php
          php tests/update-directory.php
          php tests/instagram.php
          php tests/elfsight.php
          php tests/youtube-tramino.php
          php tests/bookings.php
          php tests/feeds.php
          php tests/dealerweb.php
          php tests/planity.php
          node tests/consent.js
          node --check assets/maps.js
      - name: Build and check tag
        run: |
          VERSION=$(python3 tools/package.py)
          test "$GITHUB_REF_NAME" = "v$VERSION"
      - name: Publish release with installable ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --verify-tag --title "BB Consent $GITHUB_REF_NAME" --generate-notes
