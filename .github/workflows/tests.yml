name: Plugin tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.2', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl
          coverage: none
      - name: Syntax and PHP regressions
        run: |
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
          for test in tests/*.php; do php "$test"; done
          node tests/consent.js
          node --check assets/maps.js
          node --check includes/legal/editor.js
  wordpress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, sqlite3, openssl, curl, mbstring
          coverage: none
      - run: bash tests/wordpress/run.sh
